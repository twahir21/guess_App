<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom font for better aesthetics */
        @import url('https://fonts.googleapis.com/css2?family=Poetsen+One&display=swap:wgt@300');
        body {
            font-family: 'Poetsen One', sans-serif;
            font-weight: 300;
        }
    </style>
</head>
<body class="bg-gradient-to-r from-purple-600 to-blue-500 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md mx-auto border-4 border-blue-300">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-8 tracking-tight">
            Rock Paper Scissors
        </h1>

        <div class="flex justify-around items-center mb-8 bg-gray-100 p-2 rounded-lg shadow-inner">
            <div class="text-center">
                <p class="text-xl font-normal text-gray-700">Player</p>
                <p id="player-score" class="text-5xl font-medium text-blue-600 mt-2">0</p>
            </div>
            <span class="text-3xl font-semibold text-gray-500">-</span>
            <div class="text-center">
                <p class="text-xl font-normal text-gray-700">Computer</p>
                <p id="computer-score" class="text-5xl font-medium text-red-600 mt-2">0</p>
            </div>
        </div>

        <div id="game-status" class="text-center text-2xl font-semibold text-gray-700 mb-8 p-2 bg-yellow-100 rounded-lg shadow-md">
            Choose your move!
        </div>

        <div class="grid grid-cols-3 gap-4 mb-8">
            <button class="choice-button bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-6 rounded-lg shadow-lg transition duration-300 ease-in-out transform hover:scale-105 focus:outline-none focus:ring-4 focus:ring-blue-300">
                <span class="text-4xl" id="rock">✊</span>
                <span class="block text-lg mt-2">Rock</span>
            </button>
            <button class="choice-button bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-6 rounded-lg shadow-lg transition duration-300 ease-in-out transform hover:scale-105 focus:outline-none focus:ring-4 focus:ring-green-300">
                <span class="text-4xl" id="paper">✋</span>
                <span class="block text-lg mt-2">Paper</span>
            </button>
            <button class="choice-button bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-6 rounded-lg shadow-lg transition duration-300 ease-in-out transform hover:scale-105 focus:outline-none focus:ring-4 focus:ring-red-300">
                <span class="text-4xl" id="mkasi">✌️</span>
                <span class="block text-lg mt-2">Scissors</span>
            </button>
        </div>

        <button id="reset-button" class="w-full bg-gray-700 hover:bg-gray-800 text-white font-semibold py-2 px-6 rounded-lg shadow-lg transition duration-300 ease-in-out transform hover:scale-105 focus:outline-none focus:ring-4 focus:ring-gray-500">
            Reset Game
        </button>
    </div>
    <script src="index.js"></script>
</body>
</html>
